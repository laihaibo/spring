name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # 仅自动启用 Pages（Source: GitHub Actions），不做配置注入。
      # 不要加 static_site_generator: next —— configure-pages 不识别 next.config.ts，
      # 会额外生成 next.config.js，且 Next 优先加载 .js 而非 .ts，导致导出配置失效。
      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - run: pnpm build

      - name: Verify static export output
        run: |
          test -d out || { echo "::error::out/ 目录未生成，构建配置有误"; exit 1; }
          ls out | head -5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
